<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .login-form {
            width: 400px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            font-size: 17px;
            border: 1px solid #999;
            border-radius: 8px;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            font-size: 17px;
            border: 1px solid #999;
            border-radius: 8px;
            resize: none;
            height: 50px;
            overflow: hidden;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            border: 1px solid #555;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <form class="login-form" method="POST">

        <div class="form-group">
            <label>Username</label>
            <textarea
                name="username"
            ></textarea>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input
                type="password"
                name="password"
            >
        </div>

        <button type="submit">Login</button>

    </form>

</body>
</html>
